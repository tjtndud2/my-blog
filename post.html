<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Post · Tech Blog</title>
<script src="./blog-data.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#667eea;--primary-soft:rgba(102,126,234,0.07);--bg:#ffffff;--bg-light:#f8f8f8;--text:#1a1a1a;--text-light:#666666;--border:#e8e8e8;--shadow:0 2px 8px rgba(0,0,0,0.1);--shadow-lg:0 12px 24px rgba(0,0,0,0.08)}
[data-theme="dark"]{--primary-soft:rgba(102,126,234,0.13);--bg:#0f0f0f;--bg-light:#1a1a1a;--text:#f0f0f0;--text-light:#b0b0b0;--border:#2a2a2a;--shadow:0 2px 8px rgba(0,0,0,0.3);--shadow-lg:0 12px 24px rgba(0,0,0,0.3)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;line-height:1.6}
a{color:var(--text);text-decoration:none}
a:hover{color:var(--primary)}
input::placeholder{color:var(--text-light)}
</style>
</helmet>
<div style="background:var(--bg);color:var(--text);min-height:100vh;">
<header style="background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;">
  <div style="max-width:1200px;margin:0 auto;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;">
    <a href="index.html" style="font-size:1.5rem;font-weight:700;color:var(--text);white-space:nowrap;flex-shrink:0;">Tech Blog</a>
    <nav style="display:flex;align-items:center;gap:2rem;">
      <a href="index.html" style="font-weight:500;color:var(--text);transition:color .3s;" style-hover="color:var(--primary);">Home</a>
      <a href="blog.html" style="position:relative;font-weight:500;color:var(--primary);">Blog<span style="position:absolute;left:0;right:0;bottom:-8px;height:2px;background:var(--primary);"></span></a>
      <a href="guestbook.html" style="font-weight:500;color:var(--text);transition:color .3s;" style-hover="color:var(--primary);">Guestbook</a>
      <button onClick="{{ toggleTheme }}" aria-label="테마 전환" style="background:var(--bg);border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all .3s;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;" style-hover="border-color:var(--primary);"><sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"></path></svg></sc-if><sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></sc-if></button>
    </nav>
  </div>
</header>

<main style="max-width:1100px;margin:0 auto;padding:3rem 2rem;min-height:calc(100vh - 200px);">
  <nav aria-label="breadcrumb" style="display:flex;align-items:center;gap:.5rem;font-size:.88rem;color:var(--text-light);margin-bottom:1.25rem;flex-wrap:wrap;">
    <a href="blog.html" style="color:var(--text-light);" style-hover="color:var(--primary);">Blog</a>
    <span>›</span>
    <a href="{{ sectionHref }}" style="color:var(--text-light);" style-hover="color:var(--primary);">{{ section }}</a>
  </nav>

  <div style="display:flex;flex-direction:column;gap:.9rem;padding-bottom:2rem;margin-bottom:2.5rem;border-bottom:1px solid var(--border);">
    <h2 style="font-size:2.3rem;font-weight:800;letter-spacing:-.02em;color:var(--text);line-height:1.3;word-break:keep-all;text-wrap:pretty;">{{ title }}</h2>
    <div style="display:flex;align-items:center;gap:1rem;flex-wrap:wrap;">
      <span style="display:flex;align-items:center;gap:.4rem;font-size:.92rem;color:var(--text-light);white-space:nowrap;"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg>{{ date }}</span>
      <div style="display:flex;gap:.4rem;flex-wrap:wrap;">
        <sc-for list="{{ tags }}" as="t" hint-placeholder-count="0">
          <span style="background:var(--bg-light);color:var(--primary);border:1px solid var(--primary);padding:.15rem .6rem;border-radius:20px;font-size:.75rem;white-space:nowrap;">#{{ t }}</span>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="display:grid;grid-template-columns:200px minmax(0,1fr);gap:3rem;align-items:start;">
    <aside style="position:sticky;top:90px;display:flex;flex-direction:column;border-left:1px solid var(--border);">
      <span style="padding:0 0 .6rem .9rem;font-size:.75rem;font-weight:600;letter-spacing:.06em;color:var(--text-light);">목차</span>
      <sc-for list="{{ toc }}" as="t" hint-placeholder-count="0">
        <sc-if value="{{ t.main }}" hint-placeholder-val="{{ true }}">
          <a href="{{ t.href }}" style="display:block;padding:.35rem 0 .35rem .9rem;margin-left:-1px;border-left:2px solid transparent;font-size:.88rem;font-weight:600;color:var(--text-light);line-height:1.45;" style-hover="color:var(--primary);border-left-color:var(--primary);">{{ t.text }}</a>
        </sc-if>
        <sc-if value="{{ t.sub }}" hint-placeholder-val="{{ false }}">
          <a href="{{ t.href }}" style="display:block;padding:.3rem 0 .3rem 1.9rem;margin-left:-1px;border-left:2px solid transparent;font-size:.82rem;color:var(--text-light);line-height:1.45;" style-hover="color:var(--primary);border-left-color:var(--primary);">{{ t.text }}</a>
        </sc-if>
      </sc-for>
    </aside>

    <article style="display:flex;flex-direction:column;gap:3rem;min-width:0;">
      <sc-if value="{{ loading }}" hint-placeholder-val="{{ true }}">
        <p style="color:var(--text-light);">글을 불러오는 중…</p>
      </sc-if>
      <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
        <p style="color:var(--text-light);">{{ error }}</p>
      </sc-if>
      <div ref="{{ bodyRef }}" style="min-width:0;color:var(--text);font-size:1rem;"></div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;padding-top:2rem;border-top:1px solid var(--border);">
        <sc-if value="{{ hasPrev }}" hint-placeholder-val="{{ false }}">
          <a href="{{ prevHref }}" style="display:flex;flex-direction:column;gap:.25rem;padding:1rem 1.25rem;border:1px solid var(--border);border-radius:12px;color:var(--text);min-width:0;" style-hover="border-color:var(--primary);color:var(--primary);"><span style="font-size:.78rem;color:var(--text-light);">← 이전 글</span><span style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;">{{ prevTitle }}</span></a>
        </sc-if>
        <sc-if value="{{ noPrev }}" hint-placeholder-val="{{ true }}"><span></span></sc-if>
        <sc-if value="{{ hasNext }}" hint-placeholder-val="{{ false }}">
          <a href="{{ nextHref }}" style="display:flex;flex-direction:column;align-items:flex-end;text-align:right;gap:.25rem;padding:1rem 1.25rem;border:1px solid var(--border);border-radius:12px;color:var(--text);min-width:0;" style-hover="border-color:var(--primary);color:var(--primary);"><span style="font-size:.78rem;color:var(--text-light);">다음 글 →</span><span style="font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%;">{{ nextTitle }}</span></a>
        </sc-if>
      </div>
    </article>
  </div>
</main>

<sc-if value="{{ atBottom }}" hint-placeholder-val="{{ false }}">
  <button onClick="{{ toTop }}" aria-label="맨 위로" style="position:fixed;right:2rem;bottom:2rem;z-index:200;width:48px;height:48px;border-radius:50%;border:2px solid var(--primary);background:var(--bg);color:var(--primary);box-shadow:var(--shadow-lg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;" style-hover="background:var(--primary);color:#fff;"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
</sc-if>

<footer style="background:var(--bg-light);border-top:1px solid var(--border);padding:2rem;text-align:center;color:var(--text-light);margin-top:3rem;">
  <p>© 2026 Tech Blog. All rights reserved.</p>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const MONO = 'ui-monospace,SFMono-Regular,Menlo,Consolas,monospace';
const MD_STYLES = {
  h1: 'font-size:1.8rem;font-weight:800;margin:2.5rem 0 1rem;line-height:1.35;scroll-margin-top:90px;',
  h2: 'font-size:1.5rem;font-weight:800;margin:2.75rem 0 1rem;padding-bottom:.5rem;border-bottom:1px solid var(--border);line-height:1.4;scroll-margin-top:90px;',
  h3: 'font-size:1.2rem;font-weight:700;margin:2rem 0 .75rem;line-height:1.45;scroll-margin-top:90px;',
  h4: 'font-size:1.05rem;font-weight:700;margin:1.5rem 0 .5rem;',
  p: 'line-height:1.85;margin:.9rem 0;word-break:keep-all;',
  ul: 'padding-left:1.4rem;margin:.9rem 0;', ol: 'padding-left:1.4rem;margin:.9rem 0;',
  li: 'line-height:1.8;margin:.35rem 0;word-break:keep-all;',
  pre: 'background:var(--bg-light);border:1px solid var(--border);border-radius:10px;padding:1rem 1.25rem;overflow-x:auto;font-size:.88rem;line-height:1.65;margin:1.25rem 0;font-family:' + MONO + ';',
  table: 'width:100%;border-collapse:collapse;font-size:.92rem;',
  th: 'text-align:left;padding:.65rem .8rem;border-bottom:2px solid var(--primary);background:var(--bg-light);white-space:nowrap;font-weight:700;',
  td: 'padding:.65rem .8rem;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.6;',
  blockquote: 'margin:1.25rem 0;padding:.75rem 1.1rem;border-left:3px solid var(--primary);background:var(--bg-light);color:var(--text-light);border-radius:0 8px 8px 0;',
  a: 'color:var(--primary);text-decoration:underline;text-underline-offset:3px;',
  strong: 'font-weight:700;color:var(--text);',
  img: 'max-width:100%;border-radius:8px;margin:1rem 0;',
  hr: 'border:none;border-top:1px solid var(--border);margin:2rem 0;'
};
const INLINE_CODE = 'background:var(--primary-soft);color:var(--primary);padding:.1rem .4rem;border-radius:4px;font-size:.88em;font-family:' + MONO + ';';
const fmtDate = (iso) => { if (!iso) return ''; const [y, m, d] = iso.split('-').map(Number); return y + '년 ' + m + '월 ' + d + '일'; };
const SECTIONS = ['Module', 'Study Notes', 'Assignments', 'Projects'];

class Component extends DCLogic {
  bodyRef = React.createRef();
  state = (() => {
    let theme = '';
    try { theme = localStorage.getItem('theme') || ''; } catch (e) {}
    return { theme, atBottom: false, loading: true, error: '', meta: null, html: '', toc: [] };
  })();
  componentWillUnmount() { window.removeEventListener('scroll', this.onScroll); window.removeEventListener('resize', this.onScroll); }
  onScroll = () => {
    const d = document.documentElement;
    const atBottom = window.innerHeight + window.scrollY >= d.scrollHeight - 4;
    if (atBottom !== this.state.atBottom) this.setState({ atBottom });
  };
  componentDidMount() {
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onScroll);
    document.documentElement.setAttribute('data-theme', this.state.theme);
    let tries = 0;
    const t = setInterval(() => {
      tries++;
      if (window.BlogMD && window.marked) { clearInterval(t); this.load(); }
      else if (tries > 200) { clearInterval(t); this.setState({ loading: false, error: '글을 표시하는 데 필요한 스크립트를 불러오지 못했습니다.' }); }
    }, 50);
    if (!window.BLOG_DATA) { const w = setInterval(() => { if (window.BLOG_DATA) { clearInterval(w); this.forceUpdate(); } }, 100); }
  }
  load() {
    const f = new URLSearchParams(window.location.search).get('f') || '2026-08-31-merge-conflict-experience.md';
    fetch(window.BlogMD.POSTS_DIR + f, { cache: 'no-cache' })
      .then(r => { if (!r.ok) throw new Error(); return r.text(); })
      .then(text => {
        const meta = window.BlogMD.toPost(f, text);
        let body = window.BlogMD.parseFrontMatter(text).body.replace(/<script[\s\S]*?<\/script>/gi, '');
        const html = window.marked.parse(body);
        document.title = meta.title + ' · Tech Blog';
        this.setState({ loading: false, meta, html });
      })
      .catch(() => this.setState({ loading: false, error: '글을 찾을 수 없습니다.' }));
  }
  componentDidUpdate() {
    const el = this.bodyRef.current;
    if (!el || this.renderedHtml === this.state.html) return;
    this.renderedHtml = this.state.html;
    el.innerHTML = this.state.html;
    el.querySelectorAll('*').forEach(n => {
      const tag = n.tagName.toLowerCase();
      if (tag === 'code') { if (n.parentElement.tagName !== 'PRE') n.style.cssText = INLINE_CODE; else n.style.cssText = 'font-family:inherit;'; return; }
      if (MD_STYLES[tag]) n.style.cssText = MD_STYLES[tag];
    });
    const first = el.firstElementChild; if (first) first.style.marginTop = '0';
    el.querySelectorAll('table').forEach(tb => { const w = document.createElement('div'); w.style.cssText = 'overflow-x:auto;margin:1.25rem 0;border:1px solid var(--border);border-radius:10px;'; tb.parentNode.insertBefore(w, tb); w.appendChild(tb); tb.querySelectorAll('tr:last-child td').forEach(td => td.style.borderBottom = 'none'); });
    const mm = [];
    el.querySelectorAll('pre > code.language-mermaid').forEach(c => {
      const d = document.createElement('div');
      d.className = 'mermaid';
      d.textContent = c.textContent.replace(/\\n/g, '<br>');
      d.style.cssText = 'display:flex;justify-content:center;margin:1.5rem 0;padding:1.25rem;border:1px solid var(--border);border-radius:10px;background:var(--bg);overflow-x:auto;';
      c.parentElement.replaceWith(d); mm.push(d);
    });
    if (mm.length && window.mermaid) {
      try { window.mermaid.initialize({ startOnLoad: false, theme: this.state.theme === 'dark' ? 'dark' : 'neutral' }); window.mermaid.run({ nodes: mm }); } catch (e) {}
    }
    const toc = [];
    el.querySelectorAll('h2, h3').forEach((hd, i) => {
      hd.id = 'h-' + i;
      toc.push({ href: '#h-' + i, text: hd.textContent, main: hd.tagName === 'H2', sub: hd.tagName === 'H3' });
    });
    this.setState({ toc });
    if (window.location.hash) { const tgt = el.querySelector(window.location.hash); if (tgt) window.scrollTo({ top: tgt.getBoundingClientRect().top + window.scrollY - 90 }); }
    setTimeout(this.onScroll, 50);
  }
  renderVals() {
    const meta = this.state.meta || { title: '', date: '', tags: [], section: 'Study Notes', file: '' };
    const posts = ((window.BLOG_DATA && window.BLOG_DATA.posts) || []).filter(p => p.section === meta.section);
    const i = posts.findIndex(p => p.file === meta.file);
    const newer = i > 0 ? posts[i - 1] : null, older = i >= 0 ? posts[i + 1] : null;
    const href = (p) => 'post.html?f=' + encodeURIComponent(p.file);
    return {
      atBottom: this.state.atBottom,
      toTop: () => window.scrollTo({ top: 0, behavior: 'smooth' }),
      isDark: this.state.theme === 'dark',
      isLight: this.state.theme !== 'dark',
      toggleTheme: () => {
        const n = this.state.theme === 'dark' ? '' : 'dark';
        document.documentElement.setAttribute('data-theme', n);
        try { localStorage.setItem('theme', n); } catch (e) {}
        this.setState({ theme: n });
      },
      bodyRef: this.bodyRef,
      loading: this.state.loading, error: this.state.error,
      title: meta.title, date: fmtDate(meta.date), tags: meta.tags || [],
      section: meta.section, sectionHref: 'blog.html#sec-' + Math.max(SECTIONS.indexOf(meta.section), 0),
      toc: this.state.toc,
      hasPrev: !!older, noPrev: !older, prevTitle: older ? older.title : '', prevHref: older ? href(older) : '#',
      hasNext: !!newer, nextTitle: newer ? newer.title : '', nextHref: newer ? href(newer) : '#'
    };
  }
}
</script>
</body>
</html>
