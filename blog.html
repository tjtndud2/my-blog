<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<title>Blog · Tech Blog</title>
<script src="./blog-data.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--primary:#667eea;--primary-soft:rgba(102,126,234,0.07);--bg:#ffffff;--bg-light:#f8f8f8;--text:#1a1a1a;--text-light:#666666;--border:#e8e8e8;--shadow:0 2px 8px rgba(0,0,0,0.1);--shadow-lg:0 12px 24px rgba(0,0,0,0.08)}
[data-theme="dark"]{--primary-soft:rgba(102,126,234,0.13);--bg:#0f0f0f;--bg-light:#1a1a1a;--text:#f0f0f0;--text-light:#b0b0b0;--border:#2a2a2a;--shadow:0 2px 8px rgba(0,0,0,0.3);--shadow-lg:0 12px 24px rgba(0,0,0,0.3)}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);transition:background .3s,color .3s;line-height:1.6}
a{color:var(--text);text-decoration:none}
a:hover{color:var(--primary)}
input::placeholder{color:var(--text-light)}
</style>
</helmet>
<div style="background:var(--bg);color:var(--text);min-height:100vh;">
<header style="background:var(--bg);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;">
  <div style="max-width:1200px;margin:0 auto;padding:1rem 2rem;display:flex;justify-content:space-between;align-items:center;gap:1rem;">
    <a href="index.html" style="font-size:1.5rem;font-weight:700;color:var(--text);white-space:nowrap;flex-shrink:0;">Tech Blog</a>
    <nav style="display:flex;align-items:center;gap:2rem;">
      <a href="index.html" style="font-weight:500;color:var(--text);transition:color .3s;" style-hover="color:var(--primary);">Home</a>
      <a href="blog.html" style="position:relative;font-weight:500;color:var(--primary);">Blog<span style="position:absolute;left:0;right:0;bottom:-8px;height:2px;background:var(--primary);"></span></a>
      <a href="guestbook.html" style="font-weight:500;color:var(--text);transition:color .3s;" style-hover="color:var(--primary);">Guestbook</a>
      <button onClick="{{ toggleTheme }}" aria-label="테마 전환" style="background:var(--bg);border:1.5px solid var(--border);border-radius:10px;cursor:pointer;transition:all .3s;width:40px;height:40px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--text);flex-shrink:0;" style-hover="border-color:var(--primary);"><sc-if value="{{ isDark }}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"></path></svg></sc-if><sc-if value="{{ isLight }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path></svg></sc-if></button>
    </nav>
  </div>
</header>

<main style="max-width:1200px;margin:0 auto;padding:3rem 2rem;min-height:calc(100vh - 200px);">
  <div style="margin-bottom:2rem;">
    <h2 style="font-size:2rem;color:var(--text);margin-bottom:.5rem;">All Posts</h2>
  </div>

  <div style="display:flex;flex-direction:column;gap:1rem;margin-bottom:2rem;width:fit-content;max-width:100%;">
    <form onSubmit="{{ onSubmit }}" style="display:flex;gap:.75rem;align-items:center;width:100%;">
      <div style="flex:1;min-width:0;position:relative;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#667eea" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="position:absolute;left:18px;top:50%;transform:translateY(-50%);pointer-events:none;"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4.3-4.3"></path></svg>
        <input type="text" value="{{ query }}" onInput="{{ onSearch }}" placeholder="Search" aria-label="글 검색" style="width: 100%; padding: 12px 18px 12px 46px; border: 2px solid var(--primary); border-radius: 25px; background-color: var(--bg-light); color: var(--text); font-size: 1rem; transition: all .3s; outline: none" style-focus="box-shadow:0 0 0 3px rgba(102,126,234,0.1);">
      </div>
    </form>
    <div style="display:flex;gap:.4rem;flex-wrap:wrap;">
      <sc-for list="{{ filters }}" as="f" hint-placeholder-count="2">
        <sc-if value="{{ f.active }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ f.select }}" style="padding:.3rem .75rem;border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:20px;cursor:pointer;font-size:.8rem;transition:all .3s;white-space:nowrap;flex-shrink:0;">{{ f.label }}</button>
        </sc-if>
        <sc-if value="{{ f.inactive }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ f.select }}" style="padding:.3rem .75rem;border:1px solid var(--border);background:var(--bg-light);color:var(--text);border-radius:20px;cursor:pointer;font-size:.8rem;transition:all .3s;white-space:nowrap;flex-shrink:0;" style-hover="border-color:var(--primary);color:var(--primary);">{{ f.label }}</button>
        </sc-if>
      </sc-for>
        <span style="width:1px;align-self:stretch;background:var(--border);margin:0 .2rem;"></span>
        <sc-if value="{{ savedOnly }}" hint-placeholder-val="{{ false }}">
          <button onClick="{{ toggleSavedOnly }}" aria-pressed="true" style="display:flex;align-items:center;gap:.35rem;padding:.3rem .75rem;border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:20px;cursor:pointer;font-size:.8rem;white-space:nowrap;flex-shrink:0;"><svg viewBox="0 0 24 24" width="13" height="13" style="display:block;" fill="currentColor" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"></path></svg>저장한 글 {{ savedTotal }}</button>
        </sc-if>
        <sc-if value="{{ notSavedOnly }}" hint-placeholder-val="{{ true }}">
          <button onClick="{{ toggleSavedOnly }}" aria-pressed="false" style="display:flex;align-items:center;gap:.35rem;padding:.3rem .75rem;border:1px solid var(--border);background:var(--bg-light);color:var(--text);border-radius:20px;cursor:pointer;font-size:.8rem;white-space:nowrap;flex-shrink:0;" style-hover="border-color:var(--primary);color:var(--primary);"><svg viewBox="0 0 24 24" width="13" height="13" style="display:block;" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"></path></svg>저장한 글 {{ savedTotal }}</button>
        </sc-if>
    </div>
  </div>

  <div style="display:flex;flex-direction:column;gap:3rem;">
    <sc-for list="{{ sections }}" as="s" hint-placeholder-count="4">
      <section id="{{ s.anchor }}" style="display:flex;flex-direction:column;gap:1.25rem;scroll-margin-top:90px;">
        <div style="display:flex;align-items:baseline;gap:.6rem;padding-bottom:.75rem;border-bottom:1px solid var(--border);">
          <h3 style="font-size:1.4rem;font-weight:700;color:var(--text);white-space:nowrap;flex-shrink:0;">{{ s.label }}</h3>
          <span style="font-size:.9rem;color:var(--text-light);white-space:nowrap;">{{ s.count }}</span>
        </div>
      <sc-if value="{{ s.isModule }}" hint-placeholder-val="{{ false }}">
        <ul style="list-style:none;display:grid;grid-template-columns:repeat(auto-fill,244px);gap:1rem;">
          <sc-for list="{{ s.posts }}" as="p" hint-placeholder-count="5">
            <li style="display:flex;flex-direction:column;gap:.6rem;background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:1.4rem 1.5rem 1.25rem;box-shadow:var(--shadow);cursor:pointer;position:relative;transition:box-shadow .3s,transform .3s;color:var(--text);" style-hover="box-shadow:var(--shadow-lg);transform:translateY(-3px);color:var(--primary);">
              <button onClick="{{ p.toggleSave }}" aria-label="저장" aria-pressed="{{ p.savedStr }}" style="position:absolute;top:.85rem;right:.85rem;z-index:2;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;height:24px;width:22px;cursor:pointer;color:var(--text-light);flex-shrink:0;" style-hover="color:var(--primary);">
                    <sc-if value="{{ p.saved }}" hint-placeholder-val="{{ false }}"><span style="display:flex;color:var(--primary);"><svg viewBox="0 0 24 24" width="18" height="18" style="display:block;" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"></path></svg></span></sc-if>
                    <sc-if value="{{ p.notSaved }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="18" height="18" style="display:block;" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"></path></svg></sc-if>
                  </button>
              <a href="{{ p.href }}" style="padding-right:1.75rem;font-size:1.1rem;font-weight:700;color:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">{{ p.title }}<span style="position:absolute;inset:0;"></span></a>
              <div style="display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;gap:.5rem;">
                <sc-if value="{{ p.date }}" hint-placeholder-val="{{ false }}">
                  <span style="display:flex;align-items:center;gap:.35rem;height:24px;line-height:1;font-size:.8rem;color:var(--text-light);white-space:nowrap;min-width:0;overflow:hidden;"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg><span style="overflow:hidden;text-overflow:ellipsis;min-width:0;">{{ p.date }}</span></span>
                </sc-if>
                <sc-if value="{{ p.noDate }}" hint-placeholder-val="{{ true }}">
                  <span style="display:flex;align-items:center;height:24px;line-height:1;font-size:.8rem;color:var(--text-light);white-space:nowrap;flex-shrink:0;">예정</span>
                </sc-if>
                <div style="display:flex;align-items:center;gap:.6rem;flex-shrink:0;">
                  <button onClick="{{ p.toggleLike }}" aria-label="좋아요" aria-pressed="{{ p.likedStr }}" style="position:relative;z-index:2;display:flex;align-items:center;gap:.3rem;background:none;border:none;padding:0;height:24px;line-height:1;cursor:pointer;align-self:center;font-size:.82rem;color:var(--text-light);font-variant-numeric:tabular-nums;flex-shrink:0;">
                  <sc-if value="{{ p.liked }}" hint-placeholder-val="{{ false }}"><svg viewBox="4.5 1.5 15 21" width="15" height="21" style="display:block;flex-shrink:0;overflow:visible;" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5c-3.6 0-6.5 2.9-6.5 6.6 0 4 3.2 7.4 6.5 8.4 3.3-1 6.5-4.4 6.5-8.4 0-3.7-2.9-6.6-6.5-6.6z" fill="#ef4444"></path><path d="M10.8 17.4l1.2 1.4 1.2-1.4z" fill="#ef4444"></path><path d="M12 18.8c-.9 1.1.9 1.6 0 2.7" fill="none"></path></svg></sc-if>
                  <sc-if value="{{ p.notLiked }}" hint-placeholder-val="{{ true }}"><svg viewBox="4.5 1.5 15 21" width="15" height="21" style="display:block;flex-shrink:0;overflow:visible;" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5c-3.6 0-6.5 2.9-6.5 6.6 0 4 3.2 7.4 6.5 8.4 3.3-1 6.5-4.4 6.5-8.4 0-3.7-2.9-6.6-6.5-6.6z"></path><path d="M10.8 17.4l1.2 1.4 1.2-1.4z"></path><path d="M12 18.8c-.9 1.1.9 1.6 0 2.7"></path></svg></sc-if>
                  <span style="display:block;line-height:1;">{{ p.likeCount }}</span>
                </button>
                </div>
              </div>
            </li>
          </sc-for>
        </ul>
      </sc-if>
      <sc-if value="{{ s.notModule }}" hint-placeholder-val="{{ true }}">
        <ul style="list-style:none;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;">
          <sc-for list="{{ s.posts }}" as="p" hint-placeholder-count="4">
            <li style="height:230px;overflow:hidden;position:relative;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);cursor:pointer;transition:all .3s;" style-hover="box-shadow:var(--shadow-lg);transform:translateY(-3px);">
              <button onClick="{{ p.toggleSave }}" aria-label="저장" aria-pressed="{{ p.savedStr }}" style="position:absolute;top:.85rem;right:.85rem;z-index:2;display:flex;align-items:center;justify-content:center;background:none;border:none;padding:0;height:24px;width:22px;cursor:pointer;color:var(--text-light);flex-shrink:0;" style-hover="color:var(--primary);">
                    <sc-if value="{{ p.saved }}" hint-placeholder-val="{{ false }}"><span style="display:flex;color:var(--primary);"><svg viewBox="0 0 24 24" width="18" height="18" style="display:block;" fill="currentColor" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"></path></svg></span></sc-if>
                    <sc-if value="{{ p.notSaved }}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" width="18" height="18" style="display:block;" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z"></path></svg></sc-if>
                  </button>
              <div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-start;padding:1.5rem 1.5rem 0;">
                <a href="{{ p.href }}" style="display:block;padding-right:1.25rem;font-size:1.25rem;font-weight:700;line-height:1.4;color:var(--text);text-wrap:pretty;word-break:keep-all;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;text-overflow:ellipsis;" style-hover="color:var(--primary);">{{ p.title }}<span style="position:absolute;inset:0;"></span></a>
              </div>
              <div style="padding:.75rem 1.5rem 1.25rem;display:flex;flex-direction:column;gap:.6rem;flex-shrink:0;">
                <sc-if value="{{ p.hasTags }}" hint-placeholder-val="{{ false }}">
                  <div style="display:flex;gap:.4rem;flex-wrap:wrap;">
                    <sc-for list="{{ p.tags }}" as="t" hint-placeholder-count="3">
                      <span style="background:var(--bg-light);color:var(--primary);border:1px solid var(--primary);padding:.15rem .6rem;border-radius:20px;font-size:.75rem;white-space:nowrap;">#{{ t }}</span>
                    </sc-for>
                  </div>
                </sc-if>
                <div style="display:flex;flex-direction:row-reverse;justify-content:space-between;align-items:center;gap:.5rem;">
                  <span style="display:flex;align-items:center;gap:.35rem;height:24px;line-height:1;font-size:.8rem;color:var(--text-light);white-space:nowrap;min-width:0;overflow:hidden;"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"></rect><path d="M16 2v4M8 2v4M3 10h18"></path></svg><span style="overflow:hidden;text-overflow:ellipsis;min-width:0;">{{ p.date }}</span></span>
                  <div style="display:flex;align-items:center;gap:.6rem;flex-shrink:0;">
                  <button onClick="{{ p.toggleLike }}" aria-label="좋아요" aria-pressed="{{ p.likedStr }}" style="position:relative;z-index:2;display:flex;align-items:center;gap:.3rem;background:none;border:none;padding:0;height:24px;line-height:1;cursor:pointer;align-self:center;font-size:.82rem;color:var(--text-light);font-variant-numeric:tabular-nums;flex-shrink:0;">
                  <sc-if value="{{ p.liked }}" hint-placeholder-val="{{ false }}"><svg viewBox="4.5 1.5 15 21" width="15" height="21" style="display:block;flex-shrink:0;overflow:visible;" stroke="#ef4444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5c-3.6 0-6.5 2.9-6.5 6.6 0 4 3.2 7.4 6.5 8.4 3.3-1 6.5-4.4 6.5-8.4 0-3.7-2.9-6.6-6.5-6.6z" fill="#ef4444"></path><path d="M10.8 17.4l1.2 1.4 1.2-1.4z" fill="#ef4444"></path><path d="M12 18.8c-.9 1.1.9 1.6 0 2.7" fill="none"></path></svg></sc-if>
                  <sc-if value="{{ p.notLiked }}" hint-placeholder-val="{{ true }}"><svg viewBox="4.5 1.5 15 21" width="15" height="21" style="display:block;flex-shrink:0;overflow:visible;" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.5c-3.6 0-6.5 2.9-6.5 6.6 0 4 3.2 7.4 6.5 8.4 3.3-1 6.5-4.4 6.5-8.4 0-3.7-2.9-6.6-6.5-6.6z"></path><path d="M10.8 17.4l1.2 1.4 1.2-1.4z"></path><path d="M12 18.8c-.9 1.1.9 1.6 0 2.7"></path></svg></sc-if>
                  <span style="display:block;line-height:1;">{{ p.likeCount }}</span>
                </button>
                </div>
                </div>
              </div>
            </li>
          </sc-for>
        </ul>
      </sc-if>
        <sc-if value="{{ s.empty }}" hint-placeholder-val="{{ false }}">
          <p style="padding:1.5rem 0;color:var(--text-light);font-size:.95rem;">{{ s.emptyText }}</p>
        </sc-if>
      </section>
    </sc-for>
  </div>
</main>

<sc-if value="{{ atBottom }}" hint-placeholder-val="{{ false }}">
  <button onClick="{{ toTop }}" aria-label="맨 위로" style="position:fixed;right:2rem;bottom:2rem;z-index:200;width:48px;height:48px;border-radius:50%;border:2px solid var(--primary);background:var(--bg);color:var(--primary);box-shadow:var(--shadow-lg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .3s;" style-hover="background:var(--primary);color:#fff;"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"></path></svg></button>
</sc-if>

<footer style="background:var(--bg-light);border-top:1px solid var(--border);padding:2rem;text-align:center;color:var(--text-light);margin-top:3rem;">
  <p>© 2026 Tech Blog. All rights reserved.</p>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const fmtDate = (iso) => { const [y, m, d] = iso.split('-').map(Number); return y + '년 ' + m + '월 ' + d + '일'; };
const getData = () => window.BLOG_DATA || { posts: [], modules: [] };

class Component extends DCLogic {
  state = (() => {
    let theme = '';
    try { theme = localStorage.getItem('theme') || ''; } catch (e) {}
    const q = new URLSearchParams(window.location.search).get('q') || '';
    let likes = {}, saved = {};
    try { saved = JSON.parse(localStorage.getItem('sooyoungSaved') || '{}'); } catch (e) {}
    try { likes = JSON.parse(localStorage.getItem('sooyoungLikes') || '{}'); } catch (e) {}
    return { savedOnly: false, likes, saved, theme, today: 0, total: 0, query: q, category: 'Module', atBottom: false };
  })();
  componentWillUnmount() { window.removeEventListener('scroll', this.onScroll); window.removeEventListener('resize', this.onScroll); }
  onScroll = () => {
    const d = document.documentElement;
    const atBottom = window.innerHeight + window.scrollY >= d.scrollHeight - 4;
    if (atBottom !== this.state.atBottom) this.setState({ atBottom });
  };
  componentDidMount() {
    if (!window.BLOG_DATA) { const t = setInterval(() => { if (window.BLOG_DATA) { clearInterval(t); this.forceUpdate(); } }, 50); }
    const hash = window.location.hash;
    if (hash) setTimeout(() => { const el = document.querySelector(hash); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 90 }); }, 300);
    window.addEventListener('scroll', this.onScroll, { passive: true });
    window.addEventListener('resize', this.onScroll);
    setTimeout(this.onScroll, 0);
    document.documentElement.setAttribute('data-theme', this.state.theme);
    const d = new Date();
    const key = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    const K = 'sooyoungBlogVisits';
    let s = { date: key, today: 0, total: 0 };
    try { const p = JSON.parse(localStorage.getItem(K) || 'null'); if (p && typeof p.total === 'number') s = p; } catch (e) {}
    if (s.date !== key) { s.date = key; s.today = 0; }
    try {
      if (localStorage.getItem('sooyoungVisitorDay') !== key) { s.today++; localStorage.setItem('sooyoungVisitorDay', key); }
      if (!sessionStorage.getItem('sooyoungVisitCounted')) { s.total++; sessionStorage.setItem('sooyoungVisitCounted', '1'); }
    } catch (e) {}
    if (s.total < s.today) s.total = s.today;
    try { localStorage.setItem(K, JSON.stringify(s)); } catch (e) {}
    this.setState({ today: s.today, total: s.total });
  }
  renderVals() {
    const { query, category } = this.state;
    const q = query.trim().toLowerCase();
    const D = getData();
    const POSTS = [...D.posts].sort((a, b) => b.date.localeCompare(a.date)).map(p => ({ ...p, href: 'post.html?f=' + encodeURIComponent(p.file || ''), date: fmtDate(p.date) }));
    const MODULES = D.modules.map(m => ({ href: 'module.html?m=' + encodeURIComponent(m.title), title: m.title, date: m.period, category: '', section: 'Module', summary: '', tags: [] }));
    const cats = ['Module', 'Study Notes', 'Assignments', 'Projects'];
    const posts = POSTS.filter(p => !q || p.title.toLowerCase().includes(q) || p.summary.toLowerCase().includes(q) || p.tags.some(t => t.toLowerCase().includes(q)))
      .map(p => ({ ...p, hasTags: p.tags.length > 0, noExtra: !p.summary && p.tags.length === 0 }));
    const sections = cats.map((c, i) => {
      const list = c === 'Module'
        ? MODULES.filter(p => !q || p.title.toLowerCase().includes(q)).map(p => ({ ...p, hasTags: false, noExtra: true, noDate: !p.date }))
        : posts.filter(p => p.section === c);
      const withLike = list.map(p => {
        const key = p.file || p.title;
        const liked = !!this.state.likes[key];
        const isSaved = !!this.state.saved[key];
        return { ...p, saved: isSaved, notSaved: !isSaved, savedStr: String(isSaved),
          toggleSave: (e) => { e.preventDefault(); e.stopPropagation(); this.setState(s => { const saved = { ...s.saved }; if (saved[key]) delete saved[key]; else saved[key] = true; try { localStorage.setItem('sooyoungSaved', JSON.stringify(saved)); } catch (er) {} return { saved }; }); },
          liked, notLiked: !liked, likedStr: String(liked), likeCount: String((Number(p.likes) || 0) + (liked ? 1 : 0)),
          toggleLike: (e) => { e.preventDefault(); e.stopPropagation(); this.setState(s => { const likes = { ...s.likes }; if (likes[key]) delete likes[key]; else likes[key] = true; try { localStorage.setItem('sooyoungLikes', JSON.stringify(likes)); } catch (er) {} return { likes }; }); } };
      });
      return { isModule: c === 'Module', notModule: c !== 'Module', label: c, anchor: 'sec-' + i, posts: this.state.savedOnly ? withLike.filter(p => p.saved) : withLike, count: String(this.state.savedOnly ? withLike.filter(p => p.saved).length : list.length), empty: (this.state.savedOnly ? withLike.filter(p => p.saved).length : list.length) === 0, emptyText: this.state.savedOnly ? '저장한 글이 없습니다.' : (q ? '검색 결과가 없습니다.' : '아직 글이 없습니다.') };
    });
    return {
      isDark: this.state.theme === 'dark',
      isLight: this.state.theme !== 'dark',
      toggleTheme: () => {
        const next = this.state.theme === 'dark' ? '' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        this.setState({ theme: next });
      },
      visitToday: this.state.today.toLocaleString('ko-KR'),
      visitTotal: this.state.total.toLocaleString('ko-KR'),
      query,
      onSearch: (e) => this.setState({ query: e.target.value }),
      onSubmit: (e) => { e.preventDefault(); this.setState({ query: this.state.query }); },
      filters: cats.map(c => ({
        label: c,
        active: c === category,
        inactive: c !== category,
        select: () => { this.setState({ category: c }); const el = document.getElementById('sec-' + cats.indexOf(c)); if (el) window.scrollTo({ top: el.getBoundingClientRect().top + window.scrollY - 90, behavior: 'smooth' }); }
      })),
      sections,
      savedOnly: this.state.savedOnly, notSavedOnly: !this.state.savedOnly,
      savedTotal: String(Object.keys(this.state.saved).length),
      toggleSavedOnly: () => this.setState(s => ({ savedOnly: !s.savedOnly })),
      atBottom: this.state.atBottom,
      toTop: () => window.scrollTo({ top: 0, behavior: 'smooth' })
    };
  }
}
</script>
</body>
</html>
